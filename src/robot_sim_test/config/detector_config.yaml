# 模型
model: "yolo11n.pt"

# 模型参数
confidence_threshold: 0.25 # 置信度阈值，用于过滤低置信度的检测结果
iou_threshold: 0.45 # 非极大值抑制（NMS）的IoU阈值，用于过滤重叠的检测框
device: "cuda"
classes: [0, 1, 2, 3] # 检测的类别
# 跟踪参数
use_track: true # 是否启用跨帧跟踪（model.track），关闭则退化为逐帧检测
tracker_type: "bytetrack" # 跟踪器类型：bytetrack / botsort
track_persist: true # 是否在帧间持久化跟踪状态（仿真重置时需清理 runs/track 缓存）

# 订阅的话题
image_topic: "/kinect2/qhd/image_color_rect"
# 发布的话题
bounding_box_topic: "/detector/bounding_boxes"

# 可视化
show_window: true

# 聚合参数（detector_node 内部对 2D bbox 做时序聚合）
bbox_alpha: 0.4 # bbox EMA 平滑系数（0~1，越大越偏向新观测）
max_missed_frames: 5 # 连续漏检多少帧后标记为丢失并剔除
match_distance: 50.0 # 对无 track_id 的物体，按此中心点像素距离与现有物体近邻匹配
publish_rate: 10.0 # 全局快照发布频率（Hz）

# 目标选择策略
# nearest_first: 选择距离原点最近的物体
planning_strategy: "nearest_first"

# 主循环频率（Hz）
loop_rate: 10

# 单个目标抓取失败后的最大重试次数
max_retry_count: 2

# 订阅话题
info_topic: /ctrl/info                                    # robot_core 模式触发
detection_topic: /object_detection/detected_objects       # 3D 检测结果
grasp_result_topic: /motion_control/grasp_result          # 抓取执行反馈

# 发布话题
grasp_command_topic: /task_planning/grasp_command         # 抓取指令
phase_result_topic: /task_planning/phase_result           # 阶段完成报告
